apiVersion: v1
kind: Pod
metadata:
  name: containers-capstone-pod
spec:
  containers:
    # database app
    - name: capstone-db
      image: docker.io/library/postgres:16-alpine
      env:
        - name: POSTGRES_USER
          value: app
        - name: POSTGRES_PASSWORD
          value: secret
        - name: POSTGRES_DB
          value: mydb
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true

    # web application
    - name: capstone-web
      image: quay.io/lccrittell/containers-capstone:1.0.0
      env:
        - name: DATABASE_URL
          value: postgresql://app:secret@127.0.0.1:5432/mydb
      ports:
        - containerPort: 5000
          hostPort: 5003
          protocol: TCP

  volumes:
    - name: pgdata
      hostPath:
        path: %PGDATA_PATH%
        type: Directory

    - name: init-scripts
      hostPath:
        path: %HOMEPATH%/postgres-init
        type: Directory
